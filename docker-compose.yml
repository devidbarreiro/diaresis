version: '3.8'

services:
  # API Backend (Flask)
  diaresis-api:
    build: ./api
    container_name: diaresis-api
    ports:
      - "5000:5000"
    volumes:
      - ./uploads:/app/uploads
      - ./output:/app/output
      - ./data:/app/data
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - diaresis-network

  # Frontend (Next.js)
  diaresis-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: diaresis-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://diaresis.xyz
    depends_on:
      - diaresis-api
    restart: unless-stopped
    networks:
      - diaresis-network

networks:
  diaresis-network:
    driver: bridge

